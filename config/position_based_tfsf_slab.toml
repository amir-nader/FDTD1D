[simulation]
nx = 401
dx = 1.0e-3
courant_factor = 0.99
nsteps = 1800
save_every = 4

[excitation]
type = "tfsf"
start_x = 0.09
end_x = 0.32
incident_eps_r = 1.0
incident_mu_r = 1.0

[boundary]
left = "abc"
right = "abc"

[material]
type = "layered"

[[material.layers]]
start_x = 0.18
end_x = 0.24
eps_r = 4.0
mu_r = 1.0

[source]
type = "gaussian"
amplitude = 1.0
t0 = 4.0e-11
spread = 1.2e-11

[[monitors]]
name = "reflected"
x = 0.06

[[monitors]]
name = "incident"
x = 0.13

[[monitors]]
name = "transmitted"
x = 0.29

[diagnostics]
enabled = true
incident_monitor = "incident"
reflected_monitor = "reflected"
transmitted_monitor = "transmitted"

[output]
field = "E"
file = "outputs/position_based_tfsf_slab.gif"
fps = 20
title_prefix = "Position-based TF/SF slab"
show_material = true
label_materials = true
label_boundaries = true
