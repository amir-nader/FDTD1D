[simulation]
nx = 501
dx = 1.0e-3
courant_factor = 0.99
nsteps = 2600
save_every = 1

[excitation]
type = "tfsf"
start_x = 0.08
end_x = 0.42
incident_eps_r = 1.0
incident_mu_r = 1.0

[boundary]
left = "pml"
right = "pml"
pml_thickness = 0.04
pml_order = 3
pml_target_reflection = 1.0e-6

[material]
type = "lorentz"

[[material.layers]]
center_x = 0.25
thickness = 0.06
eps_inf = 1.5
delta_eps = 2.5
omega_0 = 1.1309733553e10
gamma = 7.5398223686e8
mu_r = 1.0
sigma_e = 0.0

[source]
type = "ricker"
amplitude = 1.0
frequency = 1.2e9
t0 = 8.0e-10

[[monitors]]
name = "reflected"
x = 0.06

[[monitors]]
name = "incident"
x = 0.16

[[monitors]]
name = "transmitted"
x = 0.34

[diagnostics]
enabled = true
incident_monitor = "incident"
reflected_monitor = "reflected"
transmitted_monitor = "transmitted"
window = "none"
frequency_min = 2.0e8
frequency_max = 3.0e9
frequency_count = 121
comparison_plot = "outputs/lorentz_slab_fdtd_vs_analytical.png"

[output]
field = "E"
file = "outputs/tfsf_lorentz_slab_analytical_compare.gif"
fps = 20
title_prefix = "TF/SF Lorentz slab analytical comparison"
show_material = true
label_materials = true
label_boundaries = true
