[simulation]
nx = 401
dx = 1.0e-3
courant_factor = 0.99
nsteps = 1600
save_every = 4
source_x = 0.18

[excitation]
type = "soft"

[boundary]
left = "pml"
right = "pml"
left_pml_thickness = 0.03
right_pml_cells = 45
left_pml_order = 3
right_pml_order = 4
left_pml_target_reflection = 1.0e-5
right_pml_target_reflection = 1.0e-7

[material]
type = "vacuum"

[source]
type = "gaussian"
amplitude = 1.0
t0 = 4.0e-11
spread = 1.2e-11

[[monitors]]
name = "left_probe"
x = 0.10

[[monitors]]
name = "right_probe"
x = 0.30

[output]
field = "E"
file = "outputs/pml_side_specific_lengths.gif"
fps = 20
title_prefix = "Side-specific PML lengths"
show_material = true
label_materials = true
label_boundaries = true
