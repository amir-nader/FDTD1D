[simulation]
nx = 401
dx = 1.0e-3
courant_factor = 0.99
nsteps = 2200
save_every = 1

[excitation]
type = "tfsf"
start_x = 0.08
end_x = 0.33
incident_eps_r = 1.0
incident_mu_r = 1.0

[boundary]
left = "pml"
right = "pml"
pml_thickness = 0.04
pml_order = 3
pml_target_reflection = 1.0e-6

[material]
type = "layered"

[[material.layers]]
center_x = 0.21
thickness = 0.06
eps_r = 4.0
mu_r = 1.0

[source]
type = "ricker"
amplitude = 1.0
frequency = 1.5e9
t0 = 8.0e-10

[[monitors]]
name = "reflected"
x = 0.06

[[monitors]]
name = "incident"
x = 0.13

[[monitors]]
name = "transmitted"
x = 0.29

[diagnostics]
enabled = true
incident_monitor = "incident"
reflected_monitor = "reflected"
transmitted_monitor = "transmitted"
port1_monitor = "incident"
port1_reflected_monitor = "reflected"
port2_monitor = "transmitted"
window = "hann"
gate_start = 6.0e-10
gate_end = 1.9e-9
frequency_min = 2.0e8
frequency_max = 3.0e9
frequency_count = 121
sparameters = true
sparameter_plot = "outputs/slab_s11_only.png"
s2p_file = "outputs/slab_s11_only.s1p"
touchstone_ports = 1
s1p_parameter = "s11"
touchstone_format = "MA"
port1_reference_plane_x = 0.16
port2_reference_plane_x = 0.24

[output]
field = "E"
file = "outputs/tfsf_slab_s11_only.gif"
fps = 20
title_prefix = "TF/SF slab S11 only"
show_material = true
label_materials = true
label_boundaries = true
