[simulation]
nx = 401
dx = 1.0e-3
courant_factor = 0.99
nsteps = 1400
save_every = 4
# Leave this commented out to place the source at the grid center automatically.
# source_position = 201
# source_x = 0.2

[excitation]
type = "soft"

[boundary]
left = "pec"
right = "pec"

[material]
type = "vacuum"

[source]
type = "gaussian"
amplitude = 1.0
t0 = 4.0e-11
spread = 1.2e-11

[output]
field = "E"
file = "outputs/fdtd_from_config.gif"
fps = 20
title_prefix = "1D FDTD from TOML"
show_material = true
label_materials = true
label_boundaries = true
